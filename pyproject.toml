[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yarnai-calculation"
version = "0.1.0"
description = "Normative calculation core for the first YarnAI function"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
yarnai-http = "yarnai.http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yarnai = ["static/*.css", "static/*.html", "static/*.js", "static/*.json", "static/*.png"]

[tool.setuptools.data-files]
"" = ["alembic.ini"]
"migrations" = ["migrations/env.py", "migrations/script.py.mako"]
"migrations/versions" = ["migrations/versions/*.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
