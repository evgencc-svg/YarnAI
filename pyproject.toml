[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yarnai-calculation"
version = "0.1.0"
description = "Normative calculation core for the first YarnAI function"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
yarnai-http = "yarnai.http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
