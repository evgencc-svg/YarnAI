services:
  - type: web
    name: yarnai-demo
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -e .
    preDeployCommand: alembic upgrade head
    startCommand: python -m yarnai.http
    healthCheckPath: /health
    envVars:
      - key: YARNAI_HOST
        value: 0.0.0.0
      - key: YARNAI_LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: yarnai-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: yarnai-postgres
    plan: free
    databaseName: yarnai
    user: yarnai
